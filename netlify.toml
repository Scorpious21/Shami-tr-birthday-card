[build]
  publish = "."

# Optional: Redirect site root to home.html if home.html is your main landing page
# [[redirects]]
#   from = "/"
#   to = "/home.html"
#   status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
