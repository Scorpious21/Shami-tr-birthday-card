
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>A Special Surprise for Shami Tr</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- Google Fonts: Outfit for modern, clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05050D;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #FFFFFF;
    }

    /* Ambient Background Gradient */
    .bg-gradient-radial {
      background: radial-gradient(circle at 50% 50%, #1A1635 0%, #0D0A1C 50%, #040308 100%);
    }

    /* Candle Flame Animation */
    .flame-glow {
      filter: drop-shadow(0 0 12px rgba(255, 180, 50, 0.9)) drop-shadow(0 0 24px rgba(255, 100, 0, 0.6));
    }

    /* Pendulum Tag Swing */
    @keyframes pendulumSwing {
      0% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
      100% { transform: rotate(-5deg); }
    }
    .animate-pendulum {
      transform-origin: top center;
      animation: pendulumSwing 3s ease-in-out infinite;
    }

    /* Shimmer effect for blade and tag */
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
      background-size: 200% 100%;
    }
  </style>
</head>

  <!-- SCRIPT LOGIC -->
  <script>
    /* ===================================================================
       SYNTHESIZED AUDIO SYSTEM (Web Audio API)
       =================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      // Wind sound when holding flame
      playWind() {
        if (!this.ctx) return;
        const bufSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 400;

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.15, this.ctx.currentTime + 0.4);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }
      // Extinguish puff
      playExtinguish() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
        
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
      }
      // Slice sound
      playSlice() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
      }
      // Magical chime / level sound
      playChime() {
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          
          const now = this.ctx.currentTime + idx * 0.08;
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        });
      }
      // Party Pop burst sound
      playPop() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      // Final Rainbow explosion sequence
      playClimax() {
        this.init();
        this.playPop();
        setTimeout(() => this.playChime(), 150);
      }
    }

    const sfx = new SoundFX();

    /* ===================================================================
       CANVAS PARTICLE ENGINE (2D Ambient & Celebration Effects)
       =================================================================== */
    const bgCanvas = document.getElementById('particleCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCanvas = document.getElementById('fxCanvas');
    const fxCtx = fxCanvas.getContext('2d');

    let width, height;
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      bgCanvas.width = fxCanvas.width = width * Math.min(window.devicePixelRatio, 2);
      bgCanvas.height = fxCanvas.height = height * Math.min(window.devicePixelRatio, 2);
      bgCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
      fxCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ambient floating background particles
    const bgParticles = Array.from({ length: 40 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2 + 0.5,
      alpha: Math.random() * 0.5 + 0.2,
      speedY: -(Math.random() * 0.3 + 0.1)
    }));

    function renderBg() {
      bgCtx.clearRect(0, 0, width, height);
      bgCtx.fillStyle = '#FFF';
      bgParticles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = height;
        bgCtx.globalAlpha = p.alpha;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bgCtx.fill();
      });
      requestAnimationFrame(renderBg);
    }
    renderBg();

    // FX Particles for Confetti & Rainbow Explosion
    let fxParticles = [];
    function triggerConfetti(count = 60, isRainbow = false) {
      const colors = isRainbow 
        ? ['#EF4444', '#F59E0B', '#10B981', '#3B82F6', '#8B5CF6', '#EC4899', '#FFFFFF']
        : ['#FBBF24', '#F472B6', '#60A5FA', '#34D399', '#FFFFFF'];

      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = isRainbow ? Math.random() * 12 + 4 : Math.random() * 8 + 2;
        fxParticles.push({
          x: width / 2,
          y: height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (isRainbow ? 3 : 1),
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.01,
          gravity: 0.15
        });
      }
    }

    function renderFx() {
      fxCtx.clearRect(0, 0, width, height);
      for (let i = fxParticles.length - 1; i >= 0; i--) {
        const p = fxParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          fxParticles.splice(i, 1);
          continue;
        }

        fxCtx.globalAlpha = p.alpha;
        fxCtx.fillStyle = p.color;
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        fxCtx.fill();
      }
      requestAnimationFrame(renderFx);
    }
    renderFx();

    /* ===================================================================
       STATE & SCENE SEQUENCE CONTROLLER
       =================================================================== */
    const students = [
      "Krushad Naik", "Tej Khobarekar", "Shivam Naik",
      "Atharva Potfode", "Tejam Barde", "Aizaan Dodamani"
    ];

    const captionEl = document.getElementById('captionText');
    const touchZone = document.getElementById('touchZone');
    const flameEl = document.getElementById('flame');
    const candleGroup = document.getElementById('candleGroup');
    const sideCake = document.getElementById('cakeSideView');
    const topCake = document.getElementById('cakeTopView');
    const knifeEl = document.getElementById('cakeKnife');
    const flashEl = document.getElementById('flashOverlay');
    const giftContainer = document.getElementById('giftContainer');
    const giftTag = document.getElementById('giftTag');
    const openGiftBtn = document.getElementById('openGiftBtn');
    const giftLid = document.getElementById('giftLid');
    const replayBadge = document.getElementById('replayBadge');

    // Check if user already saw intro
    if (localStorage.getItem("introComplete") === "true") {
      replayBadge.classList.remove('hidden');
    }
    replayBadge.addEventListener('click', () => {
      localStorage.removeItem("introComplete");
      window.location.reload();
    });

    function setCaption(text) {
      gsap.to(captionEl, { opacity: 0, duration: 0.2, onComplete: () => {
        captionEl.textContent = text;
        gsap.to(captionEl, { opacity: 1, duration: 0.3 });
      }});
    }

    function haptic(pattern) {
      if ('vibrate' in navigator) {
        try { navigator.vibrate(pattern); } catch(e){}
      }
    }

    /* SCENE 1 & 2: PRESS & HOLD TO BLOW CANDLE */
    let holdTimer = null;
    let holdProgress = 0;

    setTimeout(() => {
      setCaption("Press & hold to blow the candle 🕯️");
    }, 1200);

    function startHold(e) {
      e.preventDefault();
      sfx.init();
      holdProgress = 0;
      haptic(15);
      sfx.playWind();

      gsap.to(flameEl, { scale: 1.2, duration: 0.3 });

      holdTimer = setInterval(() => {
        holdProgress += 100;
        
        if (holdProgress === 300) {
          gsap.to(flameEl, { rotate: -15, scale: 0.8, duration: 0.3 });
        } else if (holdProgress === 700) {
          gsap.to(flameEl, { scale: 0.4, opacity: 0.7, duration: 0.3 });
          haptic(15);
        } else if (holdProgress >= 1100) {
          endHoldSuccess();
        }
      }, 100);
    }

    function cancelHold() {
      if (holdTimer) {
        clearInterval(holdTimer);
        holdTimer = null;
        gsap.to(flameEl, { scale: 1, rotate: 0, opacity: 1, duration: 0.3 });
      }
    }

    function endHoldSuccess() {
      clearInterval(holdTimer);
      holdTimer = null;
      touchZone.style.pointerEvents = 'none';

      // Extinguish candle
      sfx.playExtinguish();
      haptic([20, 25, 40]);
      gsap.to(flameEl, { opacity: 0, scale: 0, duration: 0.2 });

      setCaption("Perfect.");

      // SCENE 3: REMOVE CANDLE THEN TRANSFORM SIDE TO TOP VIEW
      setTimeout(() => {
        gsap.to(candleGroup, { opacity: 0, y: -10, duration: 0.5, onComplete: transformCakeView });
      }, 500);
    }

    touchZone.addEventListener('pointerdown', startHold);
    touchZone.addEventListener('pointerup', cancelHold);
    touchZone.addEventListener('pointerleave', cancelHold);

    /* SCENE 4: TRANSFORM SIDE-VIEW TO TOP-VIEW */
    function transformCakeView() {
      // Smooth 2D rotation & perspective tilt transformation
      gsap.to(sideCake, {
        scaleY: 0.1,
        scaleX: 1.1,
        opacity: 0,
        duration: 1.2,
        ease: "power3.inOut"
      });

      gsap.to(topCake, {
        opacity: 1,
        scale: 1,
        duration: 1.3,
        ease: "power3.inOut",
        onComplete: setupKnifeCut
      });

      setTimeout(() => {
        setCaption("One more cut...");
      }, 600);
    }

    /* SCENE 5 & 6: KNIFE APPEARS AND 6 SEQUENTIAL CUTS */
    function setupKnifeCut() {
      setCaption("Tap to cut the cake 🔪");
      knifeEl.style.pointerEvents = 'auto';

      gsap.to(knifeEl, { opacity: 1, y: 0, x: 0, duration: 0.8, ease: "back.out(1.2)" });

      const cakeClickTarget = document.getElementById('cakeContainer');
      cakeClickTarget.addEventListener('click', startSequentialCuts, { once: true });
    }

    function startSequentialCuts() {
      knifeEl.style.pointerEvents = 'none';
      haptic(15);
      
      const lines = [
        document.getElementById('cutLine1'),
        document.getElementById('cutLine2'),
        document.getElementById('cutLine3'),
        document.getElementById('cutLine4'),
        document.getElementById('cutLine5'),
        document.getElementById('cutLine6')
      ];

      let cutIndex = 0;

      function performNextCut() {
        if (cutIndex < 6) {
          sfx.playSlice();
          haptic(18);

          // Animate cut line SVG draw
          gsap.to(lines[cutIndex], { strokeDashoffset: 0, duration: 0.4 });
          
          // Animate Knife slash angle
          const angle = cutIndex * 60;
          gsap.to(knifeEl, {
            rotate: angle + 45,
            duration: 0.3,
            ease: "power2.out"
          });

          cutIndex++;
          setTimeout(performNextCut, 650);
        } else {
          // All 6 cuts finished
          gsap.to(knifeEl, { opacity: 0, scale: 0.5, duration: 0.4 });
          setTimeout(revealSlicesAndParty, 400);
        }
      }

      performNextCut();
    }

    /* SCENE 7: REVEAL 6 SLICES & PARTY POPPER */
    function revealSlicesAndParty() {
      // Slightly move out all 6 slices radially
      const sliceRotations = [-2, -1, 1, 2, 1, -1];
      for (let i = 1; i <= 6; i++) {
        const slice = document.getElementById(`slice${i}`);
        const angleRad = (i * 60 - 30) * (Math.PI / 180);
        const tx = Math.cos(angleRad) * 12;
        const ty = Math.sin(angleRad) * 12;

        gsap.to(slice, {
          x: tx,
          y: ty,
          rotate: sliceRotations[i - 1],
          duration: 0.8,
          ease: "back.out(1.5)"
        });
      }

      // Flash & Confetti Party Burst
      flashEl.style.opacity = '0.8';
      setTimeout(() => flashEl.style.opacity = '0', 100);

      sfx.playPop();
      haptic([30, 20, 45, 20, 60]);
      triggerConfetti(70);

      setCaption("Six pieces... for six students!");

      // Reassemble slices after celebration
      setTimeout(reassembleCake, 1800);
    }

    /* SCENE 8: REASSEMBLE CAKE & TRANSITION TO GIFT */
    function reassembleCake() {
      for (let i = 1; i <= 6; i++) {
        const slice = document.getElementById(`slice${i}`);
        gsap.to(slice, { x: 0, y: 0, rotate: 0, duration: 1.0, ease: "back.out(1.3)" });
      }

      setCaption("...but one big surprise.");

      setTimeout(() => {
        gsap.to(topCake, { scale: 0, opacity: 0, duration: 0.8, ease: "power2.in" });
        setTimeout(showGiftScene, 600);
      }, 1200);
    }

    /* SCENE 9: GIFT BOX APPEARS WITH PENDULUM TAG & NAMES */
    function showGiftScene() {
      document.getElementById('cakeContainer').style.display = 'none';
      giftContainer.classList.remove('pointer-events-none');

      gsap.to(giftContainer, { opacity: 1, scale: 1, duration: 1.0, ease: "back.out(1.2)" });
      gsap.to(giftTag, { opacity: 1, duration: 0.8, delay: 0.4 });
      gsap.to(openGiftBtn, { opacity: 1, y: 0, duration: 0.6, delay: 0.8 });

      setCaption("We have something for you...");

      // Sequentially reveal student names on tag
      const namesContainer = document.getElementById('studentNamesList');
      students.forEach((name, idx) => {
        setTimeout(() => {
          const tagSpan = document.createElement('span');
          tagSpan.textContent = name;
          tagSpan.className = "opacity-0 transform translate-y-2 transition-all duration-300";
          namesContainer.appendChild(tagSpan);

          setTimeout(() => {
            tagSpan.classList.remove('opacity-0', 'translate-y-2');
          }, 50);
        }, idx * 350);
      });

      // Bind Open Gift Interaction
      openGiftBtn.addEventListener('click', openGiftBox);
      document.getElementById('giftBox').addEventListener('click', openGiftBox);
    }

    /* SCENE 10 & 11: OPEN GIFT, RAINBOW EXPLOSION & HOME TRANSITION */
    let giftOpened = false;
    function openGiftBox() {
      if (giftOpened) return;
      giftOpened = true;

      haptic(20);
      
      // Shake Box
      gsap.to('#giftBox', { x: -6, duration: 0.08, repeat: 5, yoyo: true, onComplete: () => {
        gsap.to('#giftBox', { x: 0 });
        
        // Lift Lid
        gsap.to(giftLid, { rotate: -110, x: -30, y: -40, duration: 0.7, ease: "power2.out" });
        haptic([30, 20, 50, 20, 70]);
        sfx.playClimax();

        // Massive Rainbow Explosion
        triggerConfetti(120, true);

        // Bright Rainbow Screen Sweep & Flash
        setTimeout(() => {
          flashEl.style.transition = 'opacity 1.2s ease-in-out';
          flashEl.style.opacity = '1';

          setCaption("Your surprise awaits...");

          // Transition to Home Page
          setTimeout(navigateToHome, 1500);
        }, 600);
      }});
    }

    function navigateToHome() {
      localStorage.setItem("introComplete", "true");
      
      try {
        // Direct clean navigation to home.html
        window.location.href = "home.html";
      } catch (e) {
        // Fallback if running inside isolated iframe preview environment
        document.body.innerHTML = `
          <div class="flex flex-col items-center justify-center min-h-screen text-center p-6 bg-slate-950 text-amber-100">
            <h1 class="text-3xl font-bold mb-4">Happy Birthday Shami Tr! 🎉</h1>
            <p class="text-lg opacity-80 mb-6">Your interactive surprise is unlocked!</p>
            <a href="home.html" class="bg-amber-400 text-slate-950 font-bold px-6 py-3 rounded-full text-sm uppercase tracking-wider shadow-lg">Enter Home Page ➔</a>
          </div>
        `;
      }
    }
  </script>
</body>
